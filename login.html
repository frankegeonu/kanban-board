<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi - Kanban Board</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="contenitore-login">
    <h1>Kanban Board</h1>
    <p class="sottotitolo">Accedi per vedere i tuoi gruppi di lavoro</p>

    <form id="form-login" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="nome@azienda.it" autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="La tua password" autocomplete="current-password">

      <p id="messaggio-errore" class="errore"></p>

      <button type="submit">Accedi</button>
    </form>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
